cv:
  name: Sameer Kumar
  sections:
    about:
      - A systems-focused architect and engineering leader who pairs deep platform engineering with applied AI and agentic workflows — building in-house ML models, AI-assisted migrations, and clean, maintainable systems — while owning the hardest parts along the way.

    highlights:
      - bullet: Designed platform architectures spanning AI systems, healthcare integrations, enterprise SaaS platforms, and large-scale modernization initiatives.
      - bullet: 8+ years of experience designing, modernizing, and scaling enterprise software platforms, with a growing focus on AI/LLM-driven systems.
      - bullet: Led modernization programs spanning monolith decomposition, cloud adoption, and architectural transformation.
      - bullet: RubyConf India speaker and technical author with 100K+ reads on engineering and consulting topics.

    experience:
      - company: Zensar Technologies
        position: Senior Engineering Lead
        location: Pune, India (Remote)
        start_date: 2026-07

      - company: Sedin Technologies
        position: Senior Technical Consultant
        location: Bengaluru, India
        start_date: 2021-05
        end_date: 2026-07

      - company: Mindfire Solutions
        position: Software Engineer
        location: Bhubaneswar, India
        start_date: 2019-04
        end_date: 2021-05

    skills:
      - label: Languages
        details: Dart, Elixir, Java, JavaScript, Python, TypeScript, Ruby
      - label: Databases
        details: Firebase/Firestore, MongoDB, MySQL, Oracle, PostgreSQL, SQLite
      - label: Frameworks
        details: Angular, Django, Express, FastAPI, Flask, Flutter, NestJS, React/Next.js, Ruby on Rails, Vue
      - label: UI & Design
        details: Bootstrap, Figma, PrimeFaces, Material, Mantine, Radix, SCSS, Tailwind
      - label: DevOps
        details: AWS, Docker, GCP, GitHub, GitLab, Jira/Bitbucket
      - label: AI/LLM
        details: Claude, GPT, Gemini, Agentic Workflows, MCP, RAG/Vector Search, Knowledge Graphs, Prompt & Context Engineering, AI Evaluation, Sentiment Analysis

    projects:
      - name: AICrete (US)
        highlights:
          - Integrated in-house AI models for aggregate classification and structural property estimation from concrete sample images.
          - Built the entire React/Remix frontend using agentic coding workflows with Claude.
          - Used AI-driven translation workflows and custom Claude skills to migrate the platform to French with i18n.
          - Used AI-assisted analysis to decompose the Django monolith into a REST API architecture, enabling incremental frontend migration.
          - Accelerated test coverage development using AI-assisted workflows, reducing manual engineering effort while improving release confidence.
          - Optimized heavy analytics and table queries for up to 10x speed and memory improvement, using EXPLAIN ANALYZE-driven query analysis.

      - name: Vidura (IN)
        highlights:
          - Built an org-wide chat utility that ingested various types of documents into vector databases with metadata indexes for retrieval.
          - Answered natural-language queries against an ever-growing organizational knowledge base using RAG.
          - Rendered responses dynamically as text, charts, or tables depending on the query.
          - Supported read-only natural-language queries directly against the PostgreSQL database.
          - Enforced access-level security to protect sensitive data across users with different permission tiers.
          - Generalized the platform into a domain-aware system that could integrate with any knowledge base.

      - name: Subscribili (IN)
        highlights:
          - Used AI-assisted tooling to migrate a large legacy JavaScript codebase to a modern TypeScript structure.
          - Converted Figma designs directly to code using MCP-based workflows.
          - Built dental subscription-management dashboards for patients and providers, unified in a composable, plug-and-play monorepo.
          - Designed a bespoke component system using Radix and Tailwind.
          - Implemented caching strategies to enhance UX and contributed to the platform's microservice migration.

      - name: KCH (UAE)
        highlights:
          - Used AI-assisted code analysis to reverse-engineer business logic from a 20-year-old Windows-based EHR system to an on-prem private cloud.
          - Re-architected the application from HL7 to FHIR protocol and setup multi environment deployments.
          - Delivered Oracle Millennium FHIR integration for custom OAuth, patient data, and appointment management.

      - name: Collectively - theAmplify (US)
        highlights:
          - Built an NLP utility for sentiment analysis, user clustering, and topic weighting using Google AutoML and Ernie RPC-based servers.
          - Developed ML-driven services for creator analysis — anomaly detection, demographics analysis, and content sanity checks — in Ruby and Python.
          - Built data-visualization dashboards using Google Data Studio and Looker to surface social media and influencer performance in real time.
          - Upgraded a Rails v4 application to a modern Webpacker-based Rails 6 setup and integrated SSR React for complex interactivity.

      - name: SITA - DigiHub (EU)
        highlights:
          - Led the front-end team building a multinational airline and airport data-aggregation platform.
          - Migrated the platform to Angular v18 with a microservices approach, sourcing data from Microsoft, ServiceNow, and Salesforce.
          - Integrated Azure B2C auth, storage, Power BI, and SharePoint.
          - Led a brand-level redesign, implemented as an Angular component library using PrimeNG and Tailwind.

      - name: GAEA - Exto (IN)
        highlights:
          - Built an adaptive scheduling algorithm for activities and resources in the project management system.
          - Modernized a legacy Express codebase and implemented a policy-based authorization layer for access control and user impersonation.
          - Developed the v2 backend with MongoDB and NestJS, retrofitting Jest and Playwright test coverage.
          - Implemented the new scheduling UI with Angular, Bryntum Gantt, and PrimeNG.

