cv:
  name: Sameer Kumar
  sections:
    about:
      - A systems-focused polyglot engineer who enjoys modernizing messy platforms, scaling products, and turning complex problems into clean, maintainable systems — while owning the hardest parts along the way.

    highlights:
      - bullet: Delivered AI-enabled products, cloud integrations, and mission-critical solutions for construction, healthcare, aviation, and SaaS organizations.
      - bullet: 8+ years of experience designing, modernizing, and scaling enterprise software platforms, with a growing focus on AI/LLM-driven systems.
      - bullet: Led modernization programs spanning monolith decomposition, cloud adoption, and architectural transformation.
      - bullet: RubyConf India speaker and technical author with 100K+ reads on engineering and consulting topics.
      - bullet: Recognized for driving platform modernization, engineering excellence, and enterprise architecture initiatives.

