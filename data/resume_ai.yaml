    projects:
      - name: AICrete (US)
        highlights:
          - Integrated in-house AI models for aggregate classification and structural property estimation from concrete sample images.
          - Built the entire React/Remix frontend using agentic coding workflows with claude.
          - Used AI-driven translation workflows and custom claude skills to migrate the platform to french with i18n.
          - Used AI-assisted analysis to decompose the Django monolith into a REST API architecture with a React/Remix frontend.
          - Wrote the full unit test suite using AI-assisted test generation.
          - Optimized heavy analytics and table queries for up to 10x speed and memory improvement, using EXPLAIN ANALYZE-driven query analysis.

      - name: Subscribili (IN)
        highlights:
          - Used AI-assisted tooling to migrate a large legacy JavaScript codebase to a modern TypeScript structure.
          - Converted Figma designs directly to code using MCP-based workflows.
          - Built dental subscription-management dashboards for patients and providers, unified in a composable, plug-and-play monorepo.
          - Designed a bespoke component system using Radix and Tailwind.
          - Implemented strong caching strategies to enhance UX and contributed to the platform's microservice migration.

      - name: KCH (UAE)
        highlights:
          - Used AI-assisted code analysis to reverse-engineer business logic from a 20-year-old Windows-based EHR system to an on-prem private cloud.
          - Configured and deployed the application across multiple environments using Arcon PAM.
          - Re-architected the application from HL7 to FHIR.
          - Delivered Oracle Millennium FHIR integration for custom OAuth, patient data, and appointment management.

      - name: SITA - DigiHub (EU)
        highlights:
          - Led the front-end team building a multinational airline and airport data-aggregation platform.
          - Migrated the platform to Angular v18 with a microservices approach, sourcing data from Microsoft, ServiceNow, and Salesforce.
          - Integrated Azure B2C auth, storage, Power BI, and SharePoint.
          - Led a brand-level redesign, implemented as an Angular component library using PrimeNG and Tailwind.

      - name: GAEA - Exto (IN)
        highlights:
          - Built an adaptive scheduling algorithm for activities and resources in the project management system.
          - Modernized a legacy Express codebase and implemented a policy-based authorization layer for access control and user impersonation.
          - Developed the v2 backend with MongoDB and NestJS, retrofitting Jest and Playwright test coverage.
          - Implemented the new scheduling UI with Angular, Bryntum Gantt, and PrimeNG.

      - name: Collectively - theAmplify (US)
        highlights:
          - Built an NLP utility for sentiment analysis, user clustering, and topic weighting using Google AutoML and Ernie RPC-based servers.
          - Developed ML-driven services for creator analysis — anomaly detection, demographics analysis, and content sanity checks — in Ruby and Python.
          - Built data-visualization dashboards using Google Data Studio and Looker to surface social media and influencer performance in real time.
          - Upgraded a Rails v4 application to a modern Webpacker-based Rails 6 setup and integrated SSR React for complex interactivity.

